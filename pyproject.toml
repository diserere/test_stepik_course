[project]
    name = "stepik-python-oop"
    version = "0.0.1"
    requires-python = ">=3.12"
    dependencies = [
        "assertpy",
        "icecream",
        "pytest",
    ]

[project.optional-dependencies]
    dev = [
        "ruff==0.15.0",
    ]

[tool.ruff]
    # Общие настройки Ruff
    line-length = 120
    # target-version = "py310" # Указывает Ruff, какой синтаксис Python считать допустимым
    # target-version = "py313" # Указывает Ruff, какой синтаксис Python считать допустимым

[tool.ruff.lint]
    # Какие правила проверять (select) и игнорировать (ignore)
    select = [
        "E",  # Ошибки pycodestyle
        "F",  # Ошибки Pyflakes (неиспользуемые импорты и т.д.)
        "I",  # Сортировка импортов (заменяет isort)
        "B",  # Находит вероятные баги (flake8-bugbear)
    ]
    ignore = ["E501"] # Игнорировать длину строки (если где-то Ruff все же решит придраться)

[tool.pytest.ini_options]
    # Настройки для pytest, чтобы не писать флаги в консоли
    testpaths = ["oop_python_part_1", "oop_python_part_2"]
    python_files = "test_*.py"
    addopts = "-vsrA"


[tool.setuptools]
    packages = [] # Пустой список — ничего не "устанавливаем", просто ставим зависимости
