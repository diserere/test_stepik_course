name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"

    - name: Install dependencies
      run: |
        uv python install 3.13
        uv sync --extra dev

    - name: Run Ruff
      run: uv run ruff check . 

    - name: Collect tests
      run: uv run pytest --collect-only

    - name: Run tests
      run: uv run pytest
