name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # The operating system to run the job on
    strategy:
      matrix:
        python-version: ["3.10", "3.12"] # Test across different Python versions

    steps:
    - uses: actions/checkout@v4 # Step 1: Check out the repository code
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip # Upgrade pip
        # Install testing libraries (e.g., pytest) and project dependencies
        pip install pytest pytest-cov # Example for pytest and coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run tests
      run: |
        pytest -vs course_python_oop/ # Command to run the tests
